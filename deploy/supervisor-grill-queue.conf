; Queue worker for the web-push listener. One-time setup on the droplet:
;
;   sudo cp /var/www/ayeyarwady-grill/deploy/supervisor-grill-queue.conf /etc/supervisor/conf.d/grill-queue.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Then set QUEUE_CONNECTION=database in backend/.env and run
; `php artisan config:cache`. deploy.sh runs `queue:restart` on every deploy.
[program:grill-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/ayeyarwady-grill/backend/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/ayeyarwady-grill/backend
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/log/grill-queue.log
